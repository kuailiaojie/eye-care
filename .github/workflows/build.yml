name: Build EyeCare

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ x64, x86, arm64 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.402'

      - name: Verify .NET SDK
        shell: pwsh
        run: |
          dotnet --info
          dotnet --list-sdks
          $sdkVersion = dotnet --version
          if (-not $sdkVersion.StartsWith("8.0.")) {
            Write-Error "Expected .NET 8 SDK, found $sdkVersion"
          }

      - name: Restore dependencies
        run: dotnet restore EyeCare/EyeCare.csproj

      - name: Build Release
        run: dotnet build EyeCare/EyeCare.csproj -c Release --no-restore

      - name: Publish self-contained (${{ matrix.platform }})
        run: >
          dotnet publish EyeCare/EyeCare.csproj -c Release
          -p:Platform=${{ matrix.platform }}
          -r win-${{ matrix.platform }}
          --self-contained true
          -o publish/${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EyeCare-win-${{ matrix.platform }}
          path: publish/${{ matrix.platform }}/**
          if-no-files-found: error