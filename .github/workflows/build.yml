name: Build EyeCare

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            platform: x64
            runtime: win-x64
          - name: x86
            platform: x86
            runtime: win-x86
          - name: arm64
            platform: ARM64
            runtime: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.402'

      - name: Verify .NET SDK
        shell: pwsh
        run: |
          dotnet --info
          $sdkVersion = dotnet --version
          if (-not $sdkVersion.StartsWith("8.0.")) {
            Write-Error "Expected .NET 8 SDK, found $sdkVersion"
          }

      - name: Restore ${{ matrix.name }}
        run: >
          dotnet restore EyeCare/EyeCare.csproj
          -p:Platform=${{ matrix.platform }}
          -r ${{ matrix.runtime }}

      - name: Publish self-contained ${{ matrix.name }}
        run: >
          dotnet publish EyeCare/EyeCare.csproj
          -c Release
          -p:Platform=${{ matrix.platform }}
          -r ${{ matrix.runtime }}
          --self-contained true
          --no-restore
          -o publish/${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EyeCare-win-${{ matrix.name }}
          path: publish/${{ matrix.name }}/**
          if-no-files-found: error
