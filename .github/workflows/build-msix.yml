name: Build MSIX for Store

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-msix:
    name: Build MSIX (${{ matrix.platform }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            platform: x64
            rid: win-x64
          - name: x86
            platform: x86
            rid: win-x86
          - name: arm64
            platform: ARM64
            rid: win-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.402'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild EyeCare/EyeCare.csproj /t:Restore /p:Platform=${{ matrix.platform }} /p:RuntimeIdentifier=${{ matrix.rid }}

      - name: Build MSIX
        run: |
          # Store 不接受与已发布版本相同的包。使用日期和 GitHub 运行序号生成
          # 单调递增的四段式版本号，且不修改源清单。
          $build = ([DateTime]::UtcNow.Date - [DateTime]'2020-01-01').Days
          $revision = [int64]$env:GITHUB_RUN_NUMBER % 65535
          $packageVersion = "1.0.$build.$revision"
          Write-Host "Building Store package version $packageVersion"
          msbuild EyeCare/EyeCare.csproj `
            /t:Build /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:RuntimeIdentifier=${{ matrix.rid }} `
            /p:WindowsPackageType=MSIX `
            /p:AppxPackageVersion=$packageVersion `
            /p:AppxPackageOutput="$env:GITHUB_WORKSPACE\msix\EyeCare-${{ matrix.name }}.msix" `
            /p:AppxPackageSigningEnabled=False `
            /p:GenerateAppxPackageOnBuild=True `
            /p:AppxSymbolPackageEnabled=False `
            /p:AppxBundle=Never

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: EyeCare-MSIX-${{ matrix.name }}
          path: msix/*.msix
          if-no-files-found: error

  bundle:
    name: Create Store bundle
    needs: build-msix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all MSIX artifacts
        uses: actions/download-artifact@v4
        with:
          path: msix-downloads

      - name: Collect MSIX files
        shell: pwsh
        run: |
          New-Item -Path msix -ItemType Directory -Force | Out-Null
          Get-ChildItem -Path msix-downloads -Recurse -Filter *.msix | ForEach-Object {
            Copy-Item $_.FullName -Destination msix\ -Force
          }
          Get-ChildItem msix\*.msix | ForEach-Object { Write-Host "MSIX: $($_.Name) ($($_.Length) bytes)" }

      - name: MakeAppx bundle
        shell: pwsh
        run: |
          $makeAppx = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\MakeAppx.exe"
          if (-not (Test-Path $makeAppx)) {
            $makeAppx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\MakeAppx.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $makeAppx) { throw "MakeAppx.exe not found" }
          & $makeAppx bundle /d msix /p msix\EyeCare.msixbundle /v

      # NOTE: makemsixupload.exe was removed from newer Windows SDKs (10.0.22621+),
      # which is the only SDK on windows-latest runners. Partner Center accepts the
      # raw .msixbundle directly, so a missing tool is a warning, not a failure.
      - name: Create .msixupload for Store (optional)
        shell: pwsh
        run: |
          $makeMsixUpload = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makemsixupload.exe","C:\Program Files (x86)\Windows Kits\10\bin\*\x86\makemsixupload.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeMsixUpload) {
            Write-Warning "makemsixupload.exe not found (removed in Windows 11 SDK); skipping .msixupload - upload EyeCare.msixbundle to Partner Center instead"
          } else {
            & $makeMsixUpload /p msix\EyeCare.msixbundle /o msix\EyeCare.msixupload
            if ($LASTEXITCODE -ne 0) { throw "makemsixupload failed" }
            Get-ChildItem msix\EyeCare.msixupload | ForEach-Object { Write-Host "MSIXUPLOAD: $($_.Name) ($($_.Length) bytes)" }
          }

      - name: Prepare Store assets
        shell: pwsh
        run: |
          New-Item -Path store-upload -ItemType Directory -Force | Out-Null
          Copy-Item store\* store-upload\ -Recurse -Force
          Copy-Item msix\EyeCare.msixbundle store-upload\ -Force
          if (Test-Path msix\EyeCare.msixupload) { Copy-Item msix\EyeCare.msixupload store-upload\ -Force }

      - name: Upload Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: EyeCare-Store-Upload
          path: store-upload/*
          if-no-files-found: error
